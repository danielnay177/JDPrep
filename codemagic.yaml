workflows:
  jdprep-testflight:
    name: JDPrep iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: JDPrep App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.danielnay177.jdprep
      vars:
        BUNDLE_ID: com.danielnay177.jdprep
        XCODE_WORKSPACE: JDPrep.xcworkspace
        XCODE_SCHEME: JDPrep
      node: v22.13.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Generate iOS project from Expo config
        script: npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Apply App Store provisioning profile
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
